<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Floca · Unit 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Poppins:wght@600&display=swap" rel="stylesheet">
<style>
/* =========================================================
   FLOCA · Unit 1 · Bring Your Own Bottle
   Content lives in DATA (generated from the researcher's content file).
   Audio: set AUDIO_BASE to the folder URL that holds the mp3 files.
   ========================================================= */
:root{
  --sage:#3E7A5C; --sage-d:#2F6A4F; --mint:#E3F3E9; --mint-l:#F2F9F4; --mint-m:#A9D3BA;
  --rose:#B04A6E; --blush:#FBE3EA; --blush-l:#FDF2F5;
  --ink:#2B2A33; --muted:#66636E; --line:#E7E1E5; --paper:#FFFFFF; --soft:#FAF7F9;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--paper);color:var(--ink);font-family:Inter,"Segoe UI",Roboto,Arial,sans-serif;font-size:16px;line-height:1.55}
.app{max-width:560px;margin:0 auto;padding:16px 16px 28px}
h1,h2,.term,.brand{font-family:Poppins,Inter,Arial,sans-serif;font-weight:600}
h1{font-size:22px;line-height:1.25} h2{font-size:18px;line-height:1.3}
.muted{color:var(--muted)} .small{font-size:14px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--rose);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;min-height:40px}
.brand{font-size:15px;color:var(--rose)} .brand span{color:var(--muted);font-family:Inter,Arial,sans-serif;font-weight:400;font-size:13px}
.back{font-size:14px;font-weight:600;color:var(--sage-d);min-height:40px;padding:0 4px}
.gloss{margin-top:8px;font-size:14px;font-weight:600;color:var(--rose);min-height:40px;padding:0 2px;text-decoration:underline;text-underline-offset:3px}
.glosstext{background:var(--blush-l);border-radius:10px;padding:8px 12px;margin-top:4px;font-size:15px}
.note{background:var(--soft);border:1px dashed var(--line);border-radius:12px;padding:8px 12px;font-size:13px;color:var(--muted);margin:10px 0}
.unit-lab{font-size:14px;font-weight:600;color:var(--muted)}
/* stepper */
.steps{display:flex;gap:6px;margin:12px 0 16px;list-style:none}
.steps li{flex:1;text-align:center;font-size:11.5px;color:var(--muted)}
.steps li i{display:block;height:5px;border-radius:3px;background:var(--line);margin-bottom:5px}
.steps li.done i{background:var(--mint-m)} .steps li.on{color:var(--sage-d);font-weight:700}.steps li.on i{background:var(--sage)}
/* home menu */
.menu{list-style:none;margin-top:14px}
.item{display:flex;width:100%;text-align:left;align-items:center;gap:12px;border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px;min-height:64px}
.item .n{width:34px;height:34px;flex:none;border-radius:50%;background:var(--blush);color:var(--rose);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:14px}
.item.done .n{background:var(--sage);color:#fff}
.item b{display:block;font-size:15.5px} .item small{color:var(--muted);font-size:13px}
.item .st{margin-left:auto;font-size:12px;font-weight:700;color:var(--sage-d);white-space:nowrap}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:12px;font-weight:600;border:1.5px solid var(--sage);color:var(--sage-d);background:#fff}
.btn.pri{background:var(--sage);color:#fff} .btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;margin-top:16px}.row .btn{flex:1}
/* highlight */
.t{background:var(--blush);font-weight:600;padding:0 3px;border-radius:3px;box-shadow:inset 0 -2px 0 var(--rose)}
button.t{font-weight:600;cursor:pointer;color:var(--ink)}
/* text */
.sit{font-style:italic;color:var(--muted);font-size:14px;margin-bottom:6px}
.line{display:flex;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)} .line:last-child{border-bottom:0}
.who{font-weight:700;font-size:14px;color:var(--sage-d)}
.play{width:40px;height:40px;flex:none;border-radius:50%;border:1.5px solid var(--sage);color:var(--sage);display:flex;align-items:center;justify-content:center}
.play.on{background:var(--sage);color:#fff}
.poster{border:2px solid var(--mint-m);background:var(--mint-l);border-radius:20px;padding:14px 14px 6px;margin:6px 0 16px}
.poster .line{border-bottom:1px dashed #CFE6D8}
.poster .line:first-child p{font-family:Poppins,Inter,Arial,sans-serif;font-size:18px;line-height:1.35}
.sub{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:4px 0 2px}
/* card */
.seg{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--muted);gap:10px} .seg b{color:var(--ink)}
.bar{display:flex;gap:4px;margin:8px 0 12px}.bar i{flex:1;height:5px;border-radius:3px;background:var(--line)}.bar i.on{background:var(--sage)}
.card{border:1.5px solid var(--line);border-radius:20px;padding:18px}
.illu{height:140px;border-radius:14px;background:var(--soft);display:flex;align-items:center;justify-content:center;margin-bottom:10px}
.chip{display:inline-block;font-size:13px;font-weight:700;color:var(--sage-d);background:var(--mint);border-radius:999px;padding:4px 12px}
.term{font-size:26px;line-height:1.2;margin:10px 0 12px;overflow-wrap:anywhere}
.audio{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px 0 6px;border-radius:999px;border:1.5px solid var(--sage);color:var(--sage-d);font-weight:600}
.audio .c{width:32px;height:32px;border-radius:50%;background:var(--sage);color:#fff;display:flex;align-items:center;justify-content:center}
.audio.on .c{background:var(--rose)}
.lab{font-size:13px;color:var(--muted);font-weight:700;margin:14px 0 3px}
.quote{border-left:3px solid var(--sage);padding:2px 0 2px 12px;font-size:15.5px}
.dots{display:flex;gap:6px;justify-content:center;margin-top:12px}.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--sage);width:20px;border-radius:4px}
/* practice */
.prompt{background:var(--soft);border-radius:14px;padding:14px 16px;margin:4px 0 14px;font-size:15.5px}
.ctx{font-size:14.5px;color:var(--muted);margin-bottom:6px}
.gapline{font-size:15.5px}
.kind{font-size:13px;font-weight:700;color:var(--rose);margin-bottom:6px}
.opt{display:flex;width:100%;text-align:left;gap:12px;align-items:center;border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:10px;font-size:15.5px;min-height:52px}
.opt .k{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:var(--muted);flex:none}
.opt.ok{border-color:var(--sage);background:var(--mint)}.opt.ok .k{background:var(--sage);border-color:var(--sage);color:#fff}
.opt.no{border-color:var(--ink);background:#F3F2F4}.opt.no .k{background:var(--ink);border-color:var(--ink);color:#fff}
.fb{border-radius:14px;border:1.5px solid var(--sage);padding:12px 14px;margin-top:4px}
.fb.no{border-color:var(--ink)}
.fb .h{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--sage-d);margin-bottom:4px} .fb.no .h{color:var(--ink)}
.fb p{font-size:15px}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .opt{margin:0 0 10px;min-height:56px;font-size:14.5px;padding:10px 12px}
.match .opt.sel{border-color:var(--sage);box-shadow:0 0 0 2px var(--mint) inset}
.match .opt.done{border-color:var(--sage);background:var(--mint);color:var(--sage-d)}
.inp{width:100%;min-height:48px;border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;font:inherit}
textarea.inp{min-height:110px;resize:vertical}
.check{display:flex;gap:10px;align-items:flex-start;margin-top:8px;font-size:15px}
.check input{width:20px;height:20px;flex:none;margin-top:3px;accent-color:var(--sage)}
.model{background:var(--mint-l);border-radius:12px;padding:12px 14px;margin-top:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chips button{border:1.5px solid var(--rose);color:var(--rose);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600;min-height:40px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:380px){.match{grid-template-columns:1fr}}
</style>
</head>

<script>
/* ===================== SETTINGS =====================
   AUDIO_BASE: folder URL of the recorded mp3 files, ending with "/".
   Default "audio/" = the audio folder next to this file (GitHub Pages).

const AUDIO_BASE = "./";
const DATA = {"unit": 1, "title": "Bring Your Own Bottle", "situation": "Rina, Dimas, and Sari are class leaders. They are choosing a project for Adiwiyata Week.", "kind": "dialog", "lines": [{"code": "T01", "who": "Rina", "text": "[[What do you think about|U1-01]] a \"Bring Your Own Bottle\" day for our class project?", "audio": "FLC-AD-U1-T01.mp3", "part": "dialog"}, {"code": "T02", "who": "Dimas", "text": "[[I strongly agree with|U1-03]] it. Our class buys a lot of plastic bottles every day.", "audio": "FLC-AD-U1-T02.mp3", "part": "dialog"}, {"code": "T03", "who": "Sari", "text": "[[I totally agree.|U1-04]] [[The reason is|U1-09]] simple: tumblers are cheap and easy to wash.", "audio": "FLC-AD-U1-T03.mp3", "part": "dialog"}, {"code": "T04", "who": "Rina", "text": "Great. [[Do you agree with|U1-02]] doing it every Friday?", "audio": "FLC-AD-U1-T04.mp3", "part": "dialog"}, {"code": "T05", "who": "Dimas", "text": "[[Absolutely.|U1-05]] We have sports on Friday, so everyone needs water.", "audio": "FLC-AD-U1-T05.mp3", "part": "dialog"}, {"code": "T06", "who": "Sari", "text": "[[I'm not sure about that.|U1-14]] Some students forget their tumblers after sports.", "audio": "FLC-AD-U1-T06.mp3", "part": "dialog"}, {"code": "T07", "who": "Dimas", "text": "[[That's true, but|U1-12]] we can put a reminder in the class group on Thursday.", "audio": "FLC-AD-U1-T07.mp3", "part": "dialog"}, {"code": "T08", "who": "Sari", "text": "[[That's a good point.|U1-07]] [[I agree with your idea.|U1-06]]", "audio": "FLC-AD-U1-T08.mp3", "part": "dialog"}, {"code": "T09", "who": "Rina", "text": "[[I think so too.|U1-08]] And what about a fine for students who bring plastic bottles?", "audio": "FLC-AD-U1-T09.mp3", "part": "dialog"}, {"code": "T10", "who": "Dimas", "text": "[[I'm afraid I disagree.|U1-15]] A fine can make students feel bad.", "audio": "FLC-AD-U1-T10.mp3", "part": "dialog"}, {"code": "T11", "who": "Sari", "text": "[[I see your point, but|U1-13]] a small fine can help people remember.", "audio": "FLC-AD-U1-T11.mp3", "part": "dialog"}, {"code": "T12", "who": "Dimas", "text": "[[I don't think so.|U1-16]] A reward is better, [[because|U1-09]] rewards make students happy.", "audio": "FLC-AD-U1-T12.mp3", "part": "dialog"}, {"code": "T13", "who": "Rina", "text": "[[I partly agree with|U1-10]] Dimas. A reward is good, but we also need clear rules.", "audio": "FLC-AD-U1-T13.mp3", "part": "dialog"}, {"code": "T14", "who": "Sari", "text": "[[I agree up to a point, but|U1-11]] rewards can cost money.", "audio": "FLC-AD-U1-T14.mp3", "part": "dialog"}, {"code": "T15", "who": "Rina", "text": "So, no fines. [[I disagree with|U1-17]] fines, and [[I strongly disagree with|U1-18]] laughing at students who forget. Let's make a reward plan with clear rules!", "audio": "FLC-AD-U1-T15.mp3", "part": "dialog"}], "segments": [{"n": 1, "name": "Asking for opinions and strong agreement", "ids": ["U1-01", "U1-02", "U1-03", "U1-04", "U1-05"]}, {"n": 2, "name": "Agreeing and giving reasons", "ids": ["U1-06", "U1-07", "U1-08", "U1-09"]}, {"n": 3, "name": "Partly agreeing", "ids": ["U1-10", "U1-11", "U1-12", "U1-13"]}, {"n": 4, "name": "Disagreeing", "ids": ["U1-14", "U1-15", "U1-16", "U1-17", "U1-18"]}], "cards": {"U1-01": {"id_mean": "Bagaimana pendapatmu tentang …?", "id": "U1-01", "unit": 1, "seg": 1, "type": "expr", "term": "What do you think about …?", "label": "Asking for an opinion", "group": "ask", "meaning": "A question to ask what someone thinks.", "example": "What do you think about a \"Bring Your Own Bottle\" day for our class project?", "note": "Use it to ask someone's opinion before you give yours.", "img": "", "audio": "FLC-AD-U1-01.mp3", "say": "What do you think about this?"}, "U1-02": {"id_mean": "Apakah kamu setuju dengan …?", "id": "U1-02", "unit": 1, "seg": 1, "type": "expr", "term": "Do you agree with …?", "label": "Asking if someone agrees", "group": "ask", "meaning": "A question to ask if someone has the same opinion.", "example": "Do you agree with doing it every Friday?", "note": "", "img": "", "audio": "FLC-AD-U1-02.mp3", "say": "Do you agree with this?"}, "U1-03": {"id_mean": "Saya sangat setuju dengan …", "id": "U1-03", "unit": 1, "seg": 1, "type": "expr", "term": "I strongly agree with …", "label": "Strong agreement", "group": "agree", "meaning": "You agree very much.", "example": "I strongly agree with it.", "note": "Stronger than \"I agree\". People usually add a reason.", "img": "", "audio": "FLC-AD-U1-03.mp3", "say": "I strongly agree with that."}, "U1-04": {"id_mean": "Saya sangat setuju.", "id": "U1-04", "unit": 1, "seg": 1, "type": "expr", "term": "I totally agree.", "label": "Strong agreement", "group": "agree", "meaning": "You agree 100 percent.", "example": "I totally agree. The reason is simple: tumblers are cheap and easy to wash.", "note": "Use it alone, without \"with\".", "img": "", "audio": "FLC-AD-U1-04.mp3", "say": "I totally agree."}, "U1-05": {"id_mean": "Tentu saja.", "id": "U1-05", "unit": 1, "seg": 1, "type": "expr", "term": "Absolutely.", "label": "Strong agreement", "group": "agree", "meaning": "A short way to say \"Yes, I agree very much.\"", "example": "Absolutely. We have sports on Friday, so everyone needs water.", "note": "A one-word answer that sounds very sure.", "img": "", "audio": "FLC-AD-U1-05.mp3", "say": "Absolutely."}, "U1-06": {"id_mean": "Saya setuju denganmu / dengan idemu", "id": "U1-06", "unit": 1, "seg": 2, "type": "expr", "term": "I agree with you / your idea", "label": "Agreement", "group": "agree", "meaning": "You have the same opinion as the speaker.", "example": "That's a good point. I agree with your idea.", "note": "", "img": "", "audio": "FLC-AD-U1-06.mp3", "say": "I agree with your idea."}, "U1-07": {"id_mean": "Itu pendapat yang bagus.", "id": "U1-07", "unit": 1, "seg": 2, "type": "expr", "term": "That's a good point.", "label": "Agreement", "group": "agree", "meaning": "You think the other person said something smart.", "example": "That's a good point. I agree with your idea.", "note": "\"Point\" here means an idea, not a score.", "img": "", "audio": "FLC-AD-U1-07.mp3", "say": "That's a good point."}, "U1-08": {"id_mean": "Saya juga berpikir begitu.", "id": "U1-08", "unit": 1, "seg": 2, "type": "expr", "term": "I think so too.", "label": "Agreement", "group": "agree", "meaning": "You have the same opinion.", "example": "I think so too. And what about a fine for students who bring plastic bottles?", "note": "", "img": "", "audio": "FLC-AD-U1-08.mp3", "say": "I think so too."}, "U1-09": {"id_mean": "karena … / Alasannya adalah …", "id": "U1-09", "unit": 1, "seg": 2, "type": "expr", "term": "because … / The reason is …", "label": "Giving a reason", "group": "reason", "meaning": "Words to explain why you have an opinion.", "example": "I totally agree. The reason is simple: tumblers are cheap and easy to wash.", "note": "An opinion is stronger when you give a reason.", "img": "", "audio": "FLC-AD-U1-09.mp3", "say": "because... The reason is..."}, "U1-10": {"id_mean": "Saya setuju sebagian / tidak setuju sebagian dengan …", "id": "U1-10", "unit": 1, "seg": 3, "type": "expr", "term": "I partly agree / partly disagree with …", "label": "Partial agreement", "group": "partial", "meaning": "You agree with some parts, but not all.", "example": "I partly agree with Dimas. A reward is good, but we also need clear rules.", "note": "\"Partly\" means \"in some parts\". People often add \"but\".", "img": "", "audio": "FLC-AD-U1-10.mp3", "say": "I partly agree with that. I partly disagree with that."}, "U1-11": {"id_mean": "Saya setuju sampai batas tertentu, tetapi …", "id": "U1-11", "unit": 1, "seg": 3, "type": "expr", "term": "I agree up to a point, but …", "label": "Partial agreement", "group": "partial", "meaning": "You agree, but only with some parts.", "example": "I agree up to a point, but rewards can cost money.", "note": "\"Point\" here means a limit, not a score.", "img": "", "audio": "FLC-AD-U1-11.mp3", "say": "I agree up to a point, but..."}, "U1-12": {"id_mean": "Itu benar, tetapi …", "id": "U1-12", "unit": 1, "seg": 3, "type": "expr", "term": "That's true, but …", "label": "Partial agreement", "group": "partial", "meaning": "You accept the idea, then add a different idea.", "example": "That's true, but we can put a reminder in the class group on Thursday.", "note": "", "img": "", "audio": "FLC-AD-U1-12.mp3", "say": "That's true, but..."}, "U1-13": {"id_mean": "Saya mengerti maksudmu, tetapi …", "id": "U1-13", "unit": 1, "seg": 3, "type": "expr", "term": "I see your point, but …", "label": "Polite disagreement", "group": "dis", "meaning": "You understand the idea, but you think differently.", "example": "I see your point, but a small fine can help people remember.", "note": "\"See\" here means \"understand\", not \"look\".", "img": "", "audio": "FLC-AD-U1-13.mp3", "say": "I see your point, but..."}, "U1-14": {"id_mean": "Saya tidak yakin tentang itu.", "id": "U1-14", "unit": 1, "seg": 4, "type": "expr", "term": "I'm not sure about that.", "label": "Doubt", "group": "dis", "meaning": "You are not ready to agree.", "example": "I'm not sure about that. Some students forget their tumblers after sports.", "note": "A soft way to say you are not ready to agree.", "img": "", "audio": "FLC-AD-U1-14.mp3", "say": "I'm not sure about that."}, "U1-15": {"id_mean": "Maaf, saya tidak setuju.", "id": "U1-15", "unit": 1, "seg": 4, "type": "expr", "term": "I'm afraid I disagree.", "label": "Polite disagreement", "group": "dis", "meaning": "A polite way to say you do not agree.", "example": "I'm afraid I disagree. A fine can make students feel bad.", "note": "\"I'm afraid\" here means \"sorry\", not \"scared\".", "img": "", "audio": "FLC-AD-U1-15.mp3", "say": "I'm afraid I disagree."}, "U1-16": {"id_mean": "Saya rasa tidak.", "id": "U1-16", "unit": 1, "seg": 4, "type": "expr", "term": "I don't think so.", "label": "Disagreement", "group": "dis", "meaning": "You do not agree.", "example": "I do /* ===================== AUDIO (learner controlled) ===================== */
const VOICE={Narrator:[1,0.9],Rina:[1.25,0.95],Sari:[1.1,0.9],Dimas:[0.8,0.92],Andi:[0.95,0.95]};
let current=null;
function stopAudio(){ if(current&&current.pause) current.pause(); if(window.speechSynthesis) speechSynthesis.cancel(); current=null; document.querySelectorAll('.on[data-audio]').forEach(b=>b.classList.remove('on')); }
function speak(text,file,btn,who,onEnd){
  stopAudio(); let ended=false;
  const done=()=>{ if(ended) return; ended=true; if(btn) btn.classList.remove('on'); if(onEnd) onEnd(); };
  if(btn) btn.classList.add('on');
  if(AUDIO_BASE&&file){ let fb=false; const fallback=()=>{ if(fb) return; fb=true; tts(text,who,done); }; const a=new Audio(AUDIO_BASE+file); current=a; a.onended=done; a.onerror=fallback; a.play().catch(fallback); return; }
  tts(text,who,done);
}
function tts(text,who,done){
  if(!('speechSynthesis' in window)){ done(); return; }
  const u=new SpeechSynthesisUtterance(String(text).replace(/…|\.\.\./g,',').replace(/\[\[|\]\]/g,''));
  u.lang='en-US'; const v=VOICE[who]||[1,0.9]; u.pitch=v[0]; u.rate=v[1];
  const vo=speechSynthesis.getVoices().find(x=>/^en(-|_)(US|GB)/i.test(x.lang)); if(vo) u.voice=vo;
  u.onend=done; u.onerror=done; speechSynthesis.speak(u);
}

function fbHTML(ok,text){ return `<div class="fb ${ok?'':'no'}" role="status"><div class="h">${ok?ICON.ok:ICON.no}${ok?'Correct':'Not yet'}</div><p>${text}</p></div>`; }
function vPractice(){
  const list=qList(), q=list[S.q], n=list.length, a=S.att[q.id]||{tries:0,done:false,last:null};
  let head='', body='';
  if(q.listen) head+=`<div style="margin-bottom:12px"><button class="audio" data-audio data-listen="1"><span class="c">${ICON.spk}</span>Listen</button></div>`;
  if(q.line) head+=`${q.ctx?`<div class="ctx"><b>${esc(q.ctx.who)}:</b> ${esc(q.ctx.text)}</div>`:''}<div class="gapline" lang="en"><b>${esc(q.line.who)}:</b> ${esc(q.line.text).replace('_____','<span class="t">_____</span>')}</div>`;
  if(q.type==='choice'){
    const opts=shuffled(q.id,q.options);
    body=opts.map((o,k)=>{ let cls=''; if(a.done&&o===q.answer) cls='ok'; else if(a.last===o&&!a.done) cls='no';
      return `<button class="opt ${cls}" data-opt="${esc(o)}" ${a.done||a.tries>=2?'disabled':''}><span class="k">${'ABC'[k]}</span><span lang="en">${esc(o)}</span></button>`; }).join('');
    if(a.done) body+=fbHTML(true,esc(q.why));
    else if(a.last) body+=fbHTML(false,a.tries>=2?`The answer is <b>${esc(q.answer)}</b>. ${esc(q.why)}`:esc(q.hint)+' Try again.');
  } else if(q.type==='match'){
    const left=shuffled(q.id+'L',q.pairs.map(p=>p[0])), right=shuffled(q.id+'R',q.pairs.map(p=>p[1])), m=S.matched[q.id]||{};
    body=`<div class="match"><div>${left.map(t=>`<button class="opt ${m[t]?'done':''} ${S.sel===t?'sel':''}" data-left="${esc(t)}" ${m[t]?'disabled':''} lang="en">${esc(t)}</button>`).join('')}</div>
     <div>${right.map(t=>{const used=Object.values(m).includes(t);return `<button class="opt ${used?'done':''}" data-right="${esc(t)}" ${used?'disabled':''} lang="en">${esc(t)}</button>`}).join('')}</div></div>`;
    if(a.done) body+=fbHTML(true,'All pairs match. '+esc(q.why));
    else if(a.last==='miss') body+=fbHTML(false,'That pair does not match. Read the meaning again and try another pair.');
    else if(!S.sel) body+=`<p class="small muted">Tap a word on the left first.</p>`;
  } else if(q.type==='input'){
    body=`<label class="sr" for="ans">Your answer</label><input class="inp" id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" lang="en" value="${esc(a.val||'')}" ${a.done||a.tries>=2?'disabled':''} placeholder="Type the word">
     ${a.done||a.tries>=2?'':`<div class="row"><button class="btn pri" id="checkInput">Check</button></div>`}`;
    if(a.done) body+=`<div style="height:10px"></div>`+fbHTML(true,esc(q.why));
    else if(a.last) body+=`<div style="height:10px"></div>`+fbHTML(false,a.tries>=2?`The answer is <b>${esc(q.accept[0])}</b>. ${esc(q.why)}`:esc(q.hint)+' Try again.');
  }
  const canNext=a.done||a.tries>=2, lastQ=S.q===n-1;
  const title=S.set==='review'?'Unit review':`Part ${S.seg} practice`;
  return topBar(true)+steps(S.set==='review'?3:2)+segBar(title,`Question ${S.q+1} of ${n}`)+
   `<div class="kind">${esc(q.kind)}</div><div class="prompt">${q.prompt}${head?`<div style="margin-top:10px">${head}</div>`:''}</div>${body}
   <div class="row">${q.card?`<button class="btn" id="seeCard">See card</button>`:''}<button class="btn pri" id="nextQ" ${canNext?'':'disabled'}>${lastQ?'Finish':'Next question'}</button></div>`;
}
function vOneCard(){
  return topBar(true)+`<div class="seg" style="margin-bottom:10px"><span><b>Card</b></span></div>`+cardHTML(C(S.cardId))+
   `<div class="row"><button class="btn pri" id="backFromCard">Back</button></div>`;
}
function result(list){
  const scored=list.filter(q=>q.type!=='produce'), first=scored.filter(q=>S.firstTry[q.id]===true).length;
  const miss=new Set();
  scored.forEach(q=>{
    if(q.type==='match') (S.firstMiss[q.id]||[]).forEach(t=>{ const c=Object.values(DATA.cards).find(x=>x.term===t); if(c) miss.add(c.id); });
    else if(S.firstTry[q.id]!==true&&q.card) miss.add(q.card); });
  return {first,total:scored.length,miss:[...miss]};
}
function chips(ids){ return ids.length?`<div class="lab">Cards to look at again</div><div class="chips">${ids.map(id=>`<button data-term="${id}" lang="en">${esc(C(id).term)}</button>`).join('')}</div>`:`<p class="muted small" style="margin-top:6px">Great work. You remembered them all.</p>`; }
function vSegDone(){
  const r=S.lastResult, s=SEG(S.seg), next=DATA.segments.find(x=>x.n===S.seg+1);
  return topBar(true)+steps(2)+`<h2>Part ${s.n} done</h2><p style="margin-top:6px">Correct on the first try: <b>${r.first} of ${r.total}</b></p>${chips(r.miss)}
   <div class="row"><button class="btn" id="redo">Practice again</button><button class="btn pri" id="${next?'nextSeg':'toReview'}">${next?'Go to Part '+next.n:'Unit review'}</button></div>`;
}
function vRevDone(){
  const r=S.lastResult;
  return topBar(true)+steps(3)+`<h2>Unit review done</h2><p style="margin-top:6px">Correct on the first try: <b>${r.first} of ${r.total}</b></p>${chips(r.miss)}
   <div class="row"><button class="btn" id="redoRev">Review again</button><button class="btn pri" data-open="produce">Your turn</button></div>`;
}
function vProduce(){
  const p=DATA.produce, shown=S.showModel;
  return topBar(true)+steps(3)+`<div class="kind">Your turn</div><div class="prompt">${esc(p.prompt)}</div>
   <label class="sr" for="free">Your answer</label><textarea class="inp" id="free" lang="en" placeholder="Write your answer here">${esc(S.saved.produce||'')}</textarea>
   ${shown?`<div class="model"><div class="lab" style="margin-top:0">Example answer</div><p lang="en">${esc(p.model)}</p></div>
   <div class="lab">Check your own answer</div>${p.check.map(t=>`<label class="check"><input type="checkbox"> <span>${esc(t)}</span></label>`).join('')}
   <div class="row"><button class="btn pri" id="home2">Back to Unit ${DATA.unit} menu</button></div>`
   :`<div class="row"><button class="btn pri" id="showModel">Show an example answer</button></div>`}`;
}

/* ===================== ACTIONS ===================== */
function startSeg(n){ Object.assign(S,{seg:n,card:0,view:'cards'}); render(); }
function startPractice(set){
  S.set=set; S.q=0; S.att={}; S.firstTry={}; S.firstMiss={}; S.matched={}; S.shuffle={}; S.sel=null;
  if(set==='review'){ const missed=new Set(S.saved.missed); const r=DATA.review.slice();
    for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];}
    S.revList=r.filter(q=>missed.has(q.card)).concat(r.filter(q=>!missed.has(q.card))); }
  S.view='practice'; render();
}
function finish(){
  const r=result(qList()); S.lastResult=r;
  const missed=new Set(S.saved.missed);
  qList().forEach(q=>{ if(q.card&&S.firstTry[q.id]===true&&S.set==='review') missed.delete(q.card); });
  r.miss.forEach(id=>missed.add(id)); S.saved.missed=[...missed];
  if(S.set==='review'){ S.saved.review={first:r.first,total:r.total}; S.view='revdone'; }
  else { S.saved.segs[S.seg]={first:r.first,total:r.total}; S.view='segdone'; }
  save(); render();
}
function attempt(q,ok,val){
  const a=S.att[q.id]||{tries:0,done:false,last:null};
  a.tries++; a.last=val; if(val!==undefined) a.val=val;
  if(S.firstTry[q.id]===undefined) S.firstTry[q.id]=ok;
  if(ok) a.done=true; S.att[q.id]=a;
}
function openCard(id,from){ S.cardId=id; S.ret=from; S.view='card'; render(); }
function bind(){
  const on=(sel,fn)=>{ const e=$(sel); if(e) e.onclick=fn; };
  on('#home',()=>{S.view='home';render();}); on('#home2',()=>{S.saved.produce=$('#free').value;save();S.view='home';render();});
  document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{ const o=b.dataset.open;
    if(o==='text'){S.view='text';render();} else if(o==='review') startPractice('review'); else {S.showModel=false;S.view='produce';render();} });
  document.querySelectorAll('[data-seg]').forEach(b=>b.onclick=()=>startSeg(+b.dataset.seg));
  document.querySelectorAll('[data-term]').forEach(b=>b.onclick=()=>openCard(b.dataset.term,S.view));
  document.querySelectorAll('[data-line]').forEach(b=>b.onclick=()=>{const l=DATA.lines[+b.dataset.line]; speak(l.text,l.audio,b,l.who);});
  const pa=$('#playAll'); if(pa) pa.onclick=()=>{ let i=0; const next=()=>{ if(i>=DATA.lines.length) return; const l=DATA.lines[i]; const btn=document.querySelector(`[data-line="${i}"]`); i++; speak(l.text,l.audio,btn,l.who,next); }; next(); };
  on('#toPart1',()=>{S.saved.read=true;save();startSeg(1);});
  document.querySelectorAll('[data-gloss]').forEach(b=>b.onclick=()=>{ const id=b.dataset.gloss; S.gloss[id]=!S.gloss[id]; const y=window.scrollY; render(); window.scrollTo(0,y); });
  document.querySelectorAll('[data-card]').forEach(b=>b.onclick=()=>{const c=C(b.dataset.card); speak(c.say,c.audio,b,'Narrator');});
  on('#prevCard',()=>{ if(S.card===0){S.view='home';} else S.card--; render(); });
  on('#nextCard',()=>{ if(S.card===SEG(S.seg).ids.length-1) startPractice('seg'); else {S.card++; render();} });
  on('#backFromCard',()=>{ S.view=S.ret||'home'; render(); });
  if(S.view==='practice'){
    const q=qList()[S.q];
    const ls=document.querySelector('[data-listen]'); if(ls) ls.onclick=()=>{const c=C(q.card); speak(q.listen.text,q.listen.audio,ls,'Narrator');};
    document.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>{ attempt(q,b.dataset.opt===q.answer,b.dataset.opt); render(); });
    document.querySelectorAll('[data-left]').forEach(b=>b.onclick=()=>{ S.sel=b.dataset.left; const a=S.att[q.id]; if(a) a.last=null; render(); });
    document.querySelectorAll('[data-right]').forEach(b=>b.onclick=()=>{
      if(!S.sel) return; const pair=q.pairs.find(p=>p[0]===S.sel), ok=pair[1]===b.dataset.right;
      const a=S.att[q.id]||{tries:0,done:false,last:null}; a.tries++;
      if(!ok){ if(S.firstTry[q.id]===undefined) S.firstTry[q.id]=false; (S.firstMiss[q.id]=S.firstMiss[q.id]||[]).push(S.sel); a.last='miss'; }
      else { (S.matched[q.id]=S.matched[q.id]||{})[S.sel]=b.dataset.right; a.last=null; }
      if(Object.keys(S.matched[q.id]||{}).length===q.pairs.length){ a.done=true; if(S.firstTry[q.id]===undefined) S.firstTry[q.id]=true; }
      S.att[q.id]=a; S.sel=null; render(); });
    const ci=$('#checkInput'); if(ci){ const inp=$('#ans'); const go=()=>{ const v=inp.value.trim(); if(!v){inp.focus();return;} attempt(q,q.accept.some(x=>x.toLowerCase()===v.toLowerCase()),v); render(); }; ci.onclick=go; inp.onkeydown=e=>{if(e.key==='Enter')go();}; }
    on('#seeCard',()=>openCard(q.card,'practice'));
    const nq=$('#nextQ'); if(nq) nq.onclick=()=>{ if(nq.disabled) return; if(S.q===qList().length-1) finish(); else {S.q++; S.sel=null; render();} };
  }
  on('#redo',()=>startPractice('seg')); on('#redoRev',()=>startPractice('review'));
  on('#nextSeg',()=>startSeg(S.seg+1)); on('#toReview',()=>startPractice('review'));
  on('#showModel',()=>{ S.saved.produce=$('#free').value; save(); S.showModel=true; render(); });
}
if('speechSynthesis' in window){ speechSynthesis.getVoices(); }
render();
</script>
</body>
